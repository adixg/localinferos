[package]
name = "localinferos"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"       # Favor a smaller TUI executable
lto = true
codegen-units = 1
strip = true
